spring:
  application:
    name: parknic
  profiles:
    default: local
  jackson:
    default-property-inclusion: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마는 Flyway만 변경
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health
parknic:
  jwt:
    secret: ${JWT_SECRET:}
