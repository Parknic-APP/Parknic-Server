# 운영과 같은 방식(prod 프로필 + 환경변수)으로 실행하기 위한 구성
# 실행: docker compose -f docker-compose.prod.yaml --env-file .env up -d --build
# 구성: caddy(HTTPS 80/443) -> app(8080, 내부) -> db(5432, 내부). 자세한 절차는 docs/gcp-deploy.md
# 컨테이너 로그가 디스크를 채우지 않게 서비스마다 10MB x 3개까지만 보관하고 오래된 것부터 지운다
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # 호스트에 포트를 열지 않는다. app 컨테이너만 내부 네트워크로 접속한다
    volumes:
      - parknic-prod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REVIEW_MODE: ${REVIEW_MODE:-false}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-com.hwangsanghwan.parknic}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
    # 호스트에 포트를 열지 않는다. 외부에서는 caddy(HTTPS)를 통해서만 접근한다
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  # HTTPS 종료 + 인증서 자동 발급/갱신. 80/443만 호스트에 연다
  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서를 보존한다 (잃으면 재시작할 때마다 다시 발급해서 발급 횟수 제한에 걸릴 수 있음)
      - caddy-data:/data
      - caddy-config:/config
    logging: *default-logging
    restart: unless-stopped

volumes:
  parknic-prod-pgdata:
  caddy-data:
  caddy-config:
